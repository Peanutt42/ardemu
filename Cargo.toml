[package]
name = "ardemu"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "ardemu_core",
  "ardemu_gui",
  "ardemu_macros/ardemu_assemble_macro",
  "ardemu_macros/ardemu_instruction_helper_macro",
]
# ardemu_gui builds for native (desktop wgpu) by default, and for the browser
# (wasm, wgpu via WebGL2) with `trunk serve`/`trunk build`. Exclude the root
# workspaces that are native-only/web-only as needed.
default-members = [
  ".",
  "ardemu_core",
  "ardemu_gui",
  "ardemu_macros/ardemu_assemble_macro",
  "ardemu_macros/ardemu_instruction_helper_macro",
]

[workspace.dependencies]
proc-macro2 = "1.0"
quote = "1.0.40"
self-rust-tokenize = "0.4.0"
syn = { version = "2.0.100", features = ["full"] }
thiserror = { version = "2.0" }

[dependencies]
ardemu_assemble_macro = { path = "ardemu_macros/ardemu_assemble_macro" }
ardemu_core = { path = "ardemu_core" }